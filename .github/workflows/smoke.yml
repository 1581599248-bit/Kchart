name: Kchart Smoke Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r backend/requirements.txt
      - name: Python syntax
        run: python -m compileall -q backend scripts
      - name: Fast entry import
        run: |
          python - <<'PY'
          from backend.app.main_fast import app
          from backend.app import analysis_v5, analysis_v7, chart_service_v7
          paths = {getattr(r, 'path', '') for r in app.routes}
          assert '/api/chart' in paths, paths
          assert analysis_v5.ANALYSIS_VERSION == 'analysis_v5.0'
          assert analysis_v7.ANALYSIS_VERSION == 'analysis_v7.0'
          assert chart_service_v7._base.analysis_mod is analysis_v7
          assert chart_service_v7._base._BUNDLE_VERSION == 'bundle_v7'
          print('main_fast v7 chart route import OK')
          PY
      - name: Performance refactor equivalence
        run: |
          python - <<'PY'
          import numpy as np
          import pandas as pd
          from pandas.testing import assert_frame_equal
          from backend.app import divergence, indicators, pivots

          rng = np.random.default_rng(20260803)
          n = 900
          close = 100 + np.cumsum(rng.normal(0, 1, n))
          df = pd.DataFrame({
              'trade_date': pd.date_range('2022-01-01', periods=n, freq='D'),
              'open': close + rng.normal(0, .4, n),
              'high': close + rng.uniform(.1, 2, n),
              'low': close - rng.uniform(.1, 2, n),
              'close': close,
              'vol': rng.integers(1000, 100000, n).astype(float),
              'amount': rng.uniform(1e4, 1e7, n),
          })

          ref_ind = indicators.add_ma(df)
          ref_ind = indicators.add_ema(ref_ind)
          ref_ind = indicators.add_macd(ref_ind)
          ref_ind = indicators.add_kdj(ref_ind)
          ref_ind = indicators.add_rsi(ref_ind)
          ref_ind = indicators.add_wr(ref_ind)
          ref_ind = indicators.add_boll(ref_ind)
          ref_ind = indicators.add_atr(ref_ind)
          ref_ind = indicators.add_obv(ref_ind)
          ref_ind = indicators.add_adx(ref_ind)
          ref_ind = indicators.add_roc(ref_ind)
          new_ind = indicators.compute_all(df)
          assert_frame_equal(new_ind, ref_ind, check_exact=False, rtol=1e-12, atol=1e-12)

          def ref_pivots(frame, left=5, right=5):
              highs = frame['high'].to_numpy(float)
              lows = frame['low'].to_numpy(float)
              dates = frame['trade_date'].to_numpy()
              rows = []
              for i in range(left, len(frame) - right):
                  hw = highs[i-left:i+right+1]
                  if highs[i] == hw.max() and int(np.argmax(hw)) == left:
                      rows.append((i, dates[i], float(highs[i]), 'H', i + right))
                      continue
                  lw = lows[i-left:i+right+1]
                  if lows[i] == lw.min() and int(np.argmin(lw)) == left:
                      rows.append((i, dates[i], float(lows[i]), 'L', i + right))
              out = pd.DataFrame(rows, columns=['idx','trade_date','price','kind','confirmed_at_idx'])
              if len(out):
                  out['idx'] = out['idx'].astype(int)
                  out['confirmed_at_idx'] = out['confirmed_at_idx'].astype(int)
              return out

          ref_p = ref_pivots(new_ind)
          new_p = pivots.find_pivots(new_ind)
          assert_frame_equal(new_p.reset_index(drop=True), ref_p.reset_index(drop=True), check_dtype=False)

          def ref_series(series, left, right):
              values = series.to_numpy(float)
              tops, bots = [], []
              for i in range(left, len(values) - right):
                  if np.isnan(values[i]):
                      continue
                  window = values[i-left:i+right+1]
                  if np.isnan(window).any():
                      continue
                  if values[i] == window.max() and int(np.argmax(window)) == left:
                      tops.append(i)
                  elif values[i] == window.min() and int(np.argmin(window)) == left:
                      bots.append(i)
              return tops, bots

          assert divergence._series_pivots(new_ind['close'], 3, 3) == ref_series(new_ind['close'], 3, 3)
          for col in ('DIF', 'DEA', 'RSI6'):
              divergence.find_divergences(new_ind, col)
          assert len(new_ind.attrs.get('_ryan_div_price_pivots', {})) == 1

          ms = pivots.multi_scale_zigzag(new_ind)
          assert set(ms) == {'small', 'trade', 'background'}
          assert len(new_ind.attrs.get('_ryan_pivot_cache', {})) == 1
          print('indicator/pivot/divergence equivalence OK')
          PY
      - name: Analysis v5 causal validation
        run: python scripts/validate_analysis_v5.py
      - name: Analysis v7 strict structure validation
        run: python scripts/validate_analysis_v7.py
      - name: Frontend syntax
        run: |
          node --check frontend/js/api.js
          node --check frontend/js/app.js
          node --check frontend/js/ema_overlay.js
          node --check frontend/js/analysis_view.js
          node --check frontend/js/signal_quality.js
          node --check frontend/js/history_structure_labels.js
          node --check frontend/js/fast_bundle.js
      - name: Unified render path assertions
        run: |
          grep -q 'SignalQuality.filterAnnotations' frontend/js/fast_bundle.js
          grep -q 'HistoryStructureLabels.refresh' frontend/js/fast_bundle.js
          grep -q '突破颈线' frontend/js/signal_quality.js
          grep -q '跌破颈线' frontend/js/signal_quality.js
          grep -q 'history_label' backend/app/analysis_v7.py
