name: Kchart Smoke Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r backend/requirements.txt
      - name: Python syntax
        run: python -m compileall -q backend scripts
      - name: Fast entry import
        run: |
          python - <<'PY'
          from backend.app.main_fast import app
          from backend.app import analysis, analysis_v5, analysis_v7, chart_service_v7, investment_engine_v15
          paths = {getattr(r, 'path', '') for r in app.routes}
          assert '/api/chart' in paths, paths
          assert analysis_v5.ANALYSIS_VERSION == 'analysis_v5.0'
          assert analysis.ANALYSIS_VERSION == analysis_v7.ANALYSIS_VERSION
          assert analysis_v7.ANALYSIS_VERSION == 'analysis_v15.0-mw-recall'
          assert investment_engine_v15.ENGINE_VERSION == 'investment_engine_v15.0'
          assert investment_engine_v15.MAX_PATTERN_EVENTS == 12
          assert investment_engine_v15.MAX_INDICATOR_EVENTS == 10
          assert chart_service_v7._base.analysis_mod is analysis_v7
          assert chart_service_v7._base._BUNDLE_VERSION == 'bundle_v15_mw_recall'
          print('main_fast v15 M/W recall route import OK')
          PY
      - name: Performance refactor equivalence
        run: |
          python - <<'PY'
          import numpy as np
          import pandas as pd
          from pandas.testing import assert_frame_equal
          from backend.app import divergence, indicators, pivots
          rng = np.random.default_rng(20260804)
          n = 900
          close = 100 + np.cumsum(rng.normal(0, 1, n))
          df = pd.DataFrame({
              'trade_date': pd.date_range('2022-01-01', periods=n, freq='D'),
              'open': close + rng.normal(0, .4, n), 'high': close + rng.uniform(.1, 2, n),
              'low': close - rng.uniform(.1, 2, n), 'close': close,
              'vol': rng.integers(1000, 100000, n).astype(float), 'amount': rng.uniform(1e4, 1e7, n),
          })
          ref = indicators.add_roc(indicators.add_adx(indicators.add_obv(indicators.add_atr(
              indicators.add_boll(indicators.add_wr(indicators.add_rsi(indicators.add_kdj(
              indicators.add_macd(indicators.add_ema(indicators.add_ma(df)))))))))))
          new = indicators.compute_all(df)
          assert_frame_equal(new, ref, check_exact=False, rtol=1e-12, atol=1e-12)
          assert set(pivots.multi_scale_zigzag(new)) == {'small', 'trade', 'background'}
          for col in ('DIF', 'DEA', 'RSI6'):
              divergence.find_divergences(new, col)
          print('indicator/pivot/divergence equivalence OK')
          PY
      - name: Legacy causal baseline
        run: python scripts/validate_analysis_v5.py
      - name: V15 M/W geometry and recall validation
        run: python scripts/validate_investment_engine_v12.py
      - name: Frontend syntax
        run: |
          node --check frontend/js/api.js
          node --check frontend/js/app.js
          node --check frontend/js/ema_overlay.js
          node --check frontend/js/moving_average_controls.js
          node --check frontend/js/analysis_view.js
          node --check frontend/js/signal_quality.js
          node --check frontend/js/history_structure_labels.js
          node --check frontend/js/fast_bundle.js
      - name: Moving average display assertions
        run: |
          grep -q 'moving_average_controls.js' frontend/index.html
          grep -q 'moving_average_controls.css' frontend/index.html
          grep -q "ryan:kline:moving-average-groups:v2" frontend/js/moving_average_controls.js
      - name: V15 source assertions
        run: |
          grep -q 'analysis_v15.0-mw-recall' backend/app/analysis_v7.py
          grep -q 'bundle_v15_mw_recall' backend/app/chart_service_v7.py
          grep -q 'principal_intervening_pivot' backend/app/investment_engine_v15.py
          grep -q 'MAX_PATTERN_EVENTS = 12' backend/app/investment_engine_v15.py
          grep -q 'MAX_INDICATOR_EVENTS = 10' backend/app/investment_engine_v15.py
          grep -q 'RSI6最高.*>90' backend/app/investment_engine_v12.py
          grep -q 'RSI6最低.*<10' backend/app/investment_engine_v12.py
          grep -q 'waves_v7.find_waves' backend/app/investment_engine_v14.py
          grep -q 'pattern_geometry_v9.apply_geometry' backend/app/investment_engine_v14.py
          grep -q 'asset_kind = "index" if ts_api.is_index(code) else "equity"' backend/app/chart_service.py
