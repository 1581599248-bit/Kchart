name: Live Pattern Probe

on:
  pull_request:
    paths:
      - 'backend/app/investment_engine_v12.py'
      - 'backend/app/analysis_v7.py'
      - 'backend/app/chart_service.py'
      - 'backend/app/chart_service_v7.py'
      - 'scripts/live_investment_engine_v12.py'
      - '.github/workflows/live-pattern-probe.yml'

jobs:
  investment-engine-live-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r backend/requirements.txt
      - name: Run live six-index and six-equity audit
        run: python scripts/live_investment_engine_v12.py
