# Render 蓝图：RYAN K线推背图（高速缓存模式）
# Web 服务常驻，用户请求走 /api/chart 统一接口。
# 每个交易日上海时间 15:40、16:40、18:00、20:00 分批追新，避免上游晚发布。
services:
  - type: web
    name: kchart
    runtime: python
    plan: starter
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m backend.app.main_fast
    healthCheckPath: /api/meta
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: TS_TOKEN
        sync: false
      - key: TS_URL
        value: https://ts.gyzcloud.top/api
