# Render 蓝图：RYAN K线推背图（API 数据模式）
# 数据：运行时从 tushare 兼容 API（TS_URL）实时拉取并磁盘缓存；
#       TOP20 榜单为离线烘焙静态文件 data/baked_top20.json（scripts/bake_top20.py 生成，随仓库提交）。
# 部署时 Render 会提示填写 TS_TOKEN（sync:false，密钥不进仓库）。
services:
  - type: web
    name: kchart
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m backend.app.main
    healthCheckPath: /api/meta
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: TS_TOKEN
        sync: false
      - key: TS_URL
        value: https://ts.gyzcloud.top/api
